name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA on main to deploy (must have a passing CI run that uploaded a deployment artifact)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ci.yml names the artifact after the full 40-char github.sha; a
      # short/abbreviated SHA (e.g. copied from `git log`) would otherwise
      # silently fail the exact-match lookups below.
      - name: Resolve full commit SHA
        id: resolve_sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FULL_SHA=$(gh api "repos/${{ github.repository }}/commits/${{ inputs.sha }}" --jq '.sha')
          echo "Resolved ${{ inputs.sha }} -> $FULL_SHA"
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"

      # Gate: only a SHA with its own successful CI push-to-main run (the
      # only run shape that ever uploads a deploy-<sha> artifact, per
      # ci.yml) is allowed through — this proves both "came from main" and
      # "passed CI" in one check, since CI only builds pushes to main.
      - name: Resolve CI run for commit
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.resolve_sha.outputs.full_sha }}"
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&status=success" --jq '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful CI run found for commit $SHA on main — refusing to deploy an unverified SHA."
            exit 1
          fi
          echo "Found CI run $RUN_ID for $SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download deployment artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: deploy-${{ steps.resolve_sha.outputs.full_sha }}
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify artifact checksum
        run: sha256sum -c "deploy-${{ steps.resolve_sha.outputs.full_sha }}.tar.gz.sha256"

      # Only needed so `pnpm prisma migrate deploy` below has the schema and
      # migration files for this exact commit — the artifact itself is never
      # rebuilt from this checkout.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve_sha.outputs.full_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Applied directly against production Neon — never run on the droplet.
      # Scoped to this one step so the production DB URL isn't sitting in
      # every step's environment.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm prisma migrate deploy

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned droplet host key (fetched and cross-checked out-of-band
          # against the admin session's own known_hosts) — not TOFU.
          echo "${{ secrets.DEPLOY_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGNLoACiLmXAUObdlVAVf8fKFQ25PoKUIJEU9dpF54TR" >> ~/.ssh/known_hosts

      # Extracted directly into the app's own directory — never bulk-touches
      # /opt/newinvoice/.env (not part of this tarball at all), except for
      # one line rewritten in place below.
      - name: Deploy artifact
        run: |
          scp -i ~/.ssh/deploy_key "deploy-${{ steps.resolve_sha.outputs.full_sha }}.tar.gz" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/newinvoice/deploy.tar.gz
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            tar -xzf /opt/newinvoice/deploy.tar.gz -C /opt/newinvoice
            rm /opt/newinvoice/deploy.tar.gz

            # The Prisma client is generated to a custom local output path
            # (src/generated/prisma, not the @prisma/client package), so
            # Next bundles it into a single server chunk and breaks its own
            # __dirname-relative query engine lookup, even though the
            # engine binary is right there on disk. PRISMA_QUERY_ENGINE_LIBRARY
            # bypasses that broken auto-detection — computed fresh on every
            # deploy (never hardcoded) since the exact engine filename is
            # Prisma-version/target-specific and would silently go stale.
            ENGINE_PATH=$(find /opt/newinvoice/src/generated/prisma -maxdepth 1 -name "libquery_engine-*.so.node" | head -1)
            if [ -z "$ENGINE_PATH" ]; then
              echo "ERROR: no Prisma query engine binary found after deploy" >&2
              exit 1
            fi
            if grep -q "^PRISMA_QUERY_ENGINE_LIBRARY=" /opt/newinvoice/.env; then
              sed -i "s|^PRISMA_QUERY_ENGINE_LIBRARY=.*|PRISMA_QUERY_ENGINE_LIBRARY=$ENGINE_PATH|" /opt/newinvoice/.env
            else
              echo "PRISMA_QUERY_ENGINE_LIBRARY=$ENGINE_PATH" >> /opt/newinvoice/.env
            fi

            sudo systemctl restart newinvoice.service
          '

      - name: Verify service is running
        run: |
          sleep 3
          # No --no-pager: the sudoers NOPASSWD rule matches this exact
          # command with no extra args (systemd auto-disables paging anyway
          # for non-tty output, so this is a no-op change in behavior).
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'sudo systemctl status newinvoice.service'
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.NEXT_PUBLIC_APP_URL }}"
