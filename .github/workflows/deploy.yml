name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      PDF_ADAPTER: pdf-lib
      # Build-time only, matches ci.yml's placeholder — the real key used to
      # decrypt production data lives solely in the droplet's own .env, never
      # in CI, since nothing at build time needs to decrypt anything real.
      SETTINGS_ENCRYPTION_KEY: ci-placeholder-key-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Applied directly against production Neon — never run on the droplet.
      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Build
        run: pnpm build

      # `output: "standalone"` doesn't include .next/static or public/ —
      # both need to be copied alongside server.js by hand.
      - name: Assemble standalone artifact
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf deploy.tar.gz -C .next/standalone .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned droplet host key (fetched and cross-checked out-of-band
          # against the admin session's own known_hosts) — not TOFU.
          echo "${{ secrets.DEPLOY_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGNLoACiLmXAUObdlVAVf8fKFQ25PoKUIJEU9dpF54TR" >> ~/.ssh/known_hosts

      # Extracted directly into the app's own directory — never bulk-touches
      # /opt/newinvoice/.env (not part of this tarball at all), except for
      # one line rewritten in place below.
      - name: Deploy artifact
        run: |
          scp -i ~/.ssh/deploy_key deploy.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/newinvoice/deploy.tar.gz
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            tar -xzf /opt/newinvoice/deploy.tar.gz -C /opt/newinvoice
            rm /opt/newinvoice/deploy.tar.gz

            # The Prisma client is generated to a custom local output path
            # (src/generated/prisma, not the @prisma/client package), so
            # Next bundles it into a single server chunk and breaks its own
            # __dirname-relative query engine lookup, even though the
            # engine binary is right there on disk. PRISMA_QUERY_ENGINE_LIBRARY
            # bypasses that broken auto-detection — computed fresh on every
            # deploy (never hardcoded) since the exact engine filename is
            # Prisma-version/target-specific and would silently go stale.
            ENGINE_PATH=$(find /opt/newinvoice/src/generated/prisma -maxdepth 1 -name "libquery_engine-*.so.node" | head -1)
            if [ -z "$ENGINE_PATH" ]; then
              echo "ERROR: no Prisma query engine binary found after deploy" >&2
              exit 1
            fi
            if grep -q "^PRISMA_QUERY_ENGINE_LIBRARY=" /opt/newinvoice/.env; then
              sed -i "s|^PRISMA_QUERY_ENGINE_LIBRARY=.*|PRISMA_QUERY_ENGINE_LIBRARY=$ENGINE_PATH|" /opt/newinvoice/.env
            else
              echo "PRISMA_QUERY_ENGINE_LIBRARY=$ENGINE_PATH" >> /opt/newinvoice/.env
            fi

            sudo systemctl restart newinvoice.service
          '

      - name: Verify service is running
        run: |
          sleep 3
          # No --no-pager: the sudoers NOPASSWD rule matches this exact
          # command with no extra args (systemd auto-disables paging anyway
          # for non-tty output, so this is a no-op change in behavior).
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'sudo systemctl status newinvoice.service'
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.NEXT_PUBLIC_APP_URL }}"
